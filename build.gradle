plugins {
    id 'java'
}

group = 'com.cookie-build'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'opencollab-repo'
        url = uri('https://repo.opencollab.dev/main/')
    }
}

dependencies {
    implementation project(path: ':CookieDough', configuration: 'shadow')
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable'
    compileOnly 'org.geysermc.cumulus:cumulus:1.1.2'
    testImplementation 'io.papermc.paper:paper-api:26.1.2.build.74-stable'
    testImplementation 'org.geysermc.cumulus:cumulus:1.1.2'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

def targetJavaVersion = 25
java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

def mapInstallDirectory = providers.gradleProperty('cookiebuildBuildBattlesMapInstallDir')
        .map { rootProject.file(it) }
        .orElse(provider {
            new File(rootProject.projectDir.parentFile, 'Paper26_Test_Server/buildbattles_maps')
        })

tasks.register('installMaps', Copy) {
    group = 'distribution'
    description = 'Installs the versioned BuildBattles map archives into a Paper server.'
    from(layout.projectDirectory.dir('maps')) {
        include '*.zip'
    }
    into(mapInstallDirectory)
}

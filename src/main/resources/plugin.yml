name: BuildBattles
version: '${version}'
main: com.cookiebuild.buildbattles.BuildBattles
api-version: '26.1.2'
load: POSTWORLD
depend: [CookieDough]

commands:
  buildbattles:
    description: Join a BuildBattles match
    usage: /buildbattles play
    aliases: [buildbattle, bb]
    permission: buildbattles.play
  bbtheme:
    description: Vote for the BuildBattles theme while waiting
    usage: /bbtheme <theme>
    permission: buildbattles.play
  bbvote:
    description: Score the plot currently being judged
    usage: /bbvote <1-5>
    permission: buildbattles.play
  floor:
    description: Replace your plot floor with a named or held safe block
    usage: /floor [block]
    permission: buildbattles.play

permissions:
  buildbattles.play:
    description: Play Cookie Build BuildBattles
    default: true

config-version: 2

maps:
  legacy:
    archive: legacy-buildbattles.zip
    # The legacy game used a separate lobby world. Reuse the first plot while
    # waiting because the recovered game world has no dedicated waiting platform.
    waiting-spawn: [185.5, 5.5, 155.5, 135.0]
    judging-height: 6.0
    # Recovered from the deployed server config and verified against the 27x27
    # terracotta plot floors at y=4.
    plot-half-size: 13
    plot-up: 20
    plot-down: 2
    plots:
      - [185.5, 5.5, 155.5, 135.0]
      - [185.5, 5.5, 112.5, 90.0]
      - [143.5, 5.5, 112.5, 45.0]
      - [143.5, 5.5, 155.5, 135.0]
      - [101.5, 5.5, 112.5, -45.0]
      - [60.5, 5.5, 112.5, -90.0]
      - [60.5, 5.5, 70.5, -45.0]
      - [101.5, 5.5, 70.5, 0.0]

game:
  build-seconds: 300
  judging-seconds-per-plot: 12
  results-seconds: 10
  reconnect-grace-seconds: 60
  theme-candidates: 3

floor:
  cooldown-seconds: 5
  blocks-per-tick: 300

rewards:
  participation-coins: 5
  participation-xp: 20
  victory-coins: 20
  victory-xp: 80


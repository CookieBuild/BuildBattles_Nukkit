config-version: 4

maps:
  legacy:
    archive: legacy-buildbattles.zip
    # The legacy separate lobby world is still missing. This temporary waiting
    # area reuses the first plot and is explicitly labelled in-game.
    waiting-spawn: [185.5, 5.5, 155.5, 135.0]
    judging-height: 6.0
    # Recovered from the deployed server config and verified against the 27x27
    # terracotta plot floors at y=4.
    plot-half-size: 13
    plot-up: 20
    plot-down: 2
    plots:
      - [185.5, 5.5, 155.5, 135.0]
      - [185.5, 5.5, 112.5, 90.0]
      - [143.5, 5.5, 112.5, 45.0]
      - [143.5, 5.5, 155.5, 135.0]
      - [101.5, 5.5, 112.5, -45.0]
      - [60.5, 5.5, 112.5, -90.0]
      - [60.5, 5.5, 70.5, -45.0]
      - [101.5, 5.5, 70.5, 0.0]

game:
  # Build phase of a match that starts with two or more builders.
  build-seconds: 300
  # Build phase of a match that starts with a single builder.
  solo-build-seconds: 180
  judging-seconds-per-plot: 12
  results-seconds: 10
  reconnect-grace-seconds: 60
  # A queued player joins a running match on a free plot during this share of
  # its build phase (duration fixed at start) instead of waiting alone in an
  # empty lobby. The legacy fixed `late-join-seconds` still wins if set.
  late-join-fraction: 0.5
  # When someone joins late, the build timer becomes max(current end,
  # now + this many seconds): nobody loses time, the newcomer gets at least 2 min.
  late-join-min-build-seconds: 120
  theme-candidates: 3

# Public Build Battle gallery (tables created by the website migration 0024).
gallery:
  enabled: true
  # Shown as plain text: <host>/b/<code> for a build, <host>/builds for the gallery.
  host: cookie-build.com

floor:
  cooldown-seconds: 5
  blocks-per-tick: 300

safety:
  # All limits are scoped to one player's plot. With eight players this keeps
  # the arena below 128 player-created entities and 512 redstone components.
  max-entities-per-player: 16
  max-decoration-entities-per-player: 12
  max-armor-stands-per-player: 4
  max-living-entities-per-player: 4
  max-villagers-per-player: 2
  max-redstone-components-per-player: 64
  max-lava-sources-per-player: 8
  max-redstone-updates-per-second: 128
  redstone-cooldown-seconds: 5

rewards:
  participation-coins: 5
  participation-xp: 20
  victory-coins: 20
  victory-xp: 80

